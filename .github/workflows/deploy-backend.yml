name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Upload & Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build Go binary (linux/amd64)
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload binary to GCS
        run: |
          gsutil cp backend/server gs://${{ vars.GCS_BUCKET }}/micro-trading/server
          echo "✓ Uploaded to gs://${{ vars.GCS_BUCKET }}/micro-trading/server"

      - name: Deploy to VM
        run: |
          gcloud compute ssh micro-trading-server \
            --project=micro-trading-495614 \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="
              gsutil cp gs://${{ vars.GCS_BUCKET }}/micro-trading/server /tmp/server-new &&
              sudo mv /tmp/server-new /opt/trading/server &&
              sudo chmod +x /opt/trading/server &&
              sudo systemctl restart micro-trading &&
              echo '✓ Deployment complete'
            "
