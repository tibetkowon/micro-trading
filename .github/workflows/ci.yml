name: CI/CD (자동)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ─── 필요한 GitHub Secrets / Variables ────────────────────────────────────────
# Secrets:
#   GCP_SA_KEY               — GCP 서비스 계정 JSON (Storage Object Admin)
#   FIREBASE_SERVICE_ACCOUNT — Firebase Hosting 배포용 서비스 계정 JSON
# Variables:
#   GCS_BUCKET         — GCS 버킷 이름 (예: my-trading-deploy)
#   FIREBASE_PROJECT_ID — Firebase 프로젝트 ID
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── 1. 변경 감지 ────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch(수동)일 때는 항상 true, 그 외엔 paths-filter 결과 사용
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─── 2. CI ───────────────────────────────────────────────────────────────────
  backend-ci:
    name: Go Build & Test
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: |
          gofmt_out=$(gofmt -l .)
          if [ -n "$gofmt_out" ]; then
            echo "The following files need formatting:"
            echo "$gofmt_out"
            exit 1
          fi

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

  frontend-ci:
    name: React Lint & Build
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── 3. 배포 (main 브랜치 push에서만, PR은 배포 안 함) ──────────────────────
  deploy-backend:
    name: Deploy Backend → GCS
    needs: [backend-ci]
    # backend-ci가 성공했고, main push 또는 수동 실행일 때 실행
    if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build Go binary (linux/amd64)
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload binary to GCS
        run: |
          gsutil cp backend/server gs://${{ vars.GCS_BUCKET }}/micro-trading/server
          echo "✓ Uploaded to gs://${{ vars.GCS_BUCKET }}/micro-trading/server"

      - name: Check VM status
        id: vm-status
        run: |
          STATUS=$(gcloud compute instances describe micro-trading-vm \
            --project=micro-trading-495614 \
            --zone=asia-northeast3-a \
            --format='get(status)')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "VM status: $STATUS"

      - name: Deploy to VM
        if: steps.vm-status.outputs.status == 'RUNNING'
        run: |
          gcloud compute ssh micro-trading-vm \
            --project=micro-trading-495614 \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="
              gsutil cp gs://${{ vars.GCS_BUCKET }}/micro-trading/server /tmp/server-new &&
              sudo mv /tmp/server-new /opt/trading/server &&
              sudo chmod +x /opt/trading/server &&
              sudo systemctl restart micro-trading &&
              echo '✓ Deployment complete'
            "

      - name: VM not running — skip restart
        if: steps.vm-status.outputs.status != 'RUNNING'
        run: echo "VM is ${{ steps.vm-status.outputs.status }}. Binary uploaded to GCS. Will be applied on next startup."

  deploy-frontend:
    name: Deploy Frontend → Firebase Hosting
    needs: [frontend-ci]
    # frontend-ci가 성공했고, main push 또는 수동 실행일 때 실행
    if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
